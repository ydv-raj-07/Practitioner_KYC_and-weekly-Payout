services:
  db:
    image: postgres:16
    container_name: KYC_and_Weekly_payments
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Raj1234
      POSTGRES_DB: KYC_and_Weekly_payments
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d KYC_and_Weekly_payments"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: